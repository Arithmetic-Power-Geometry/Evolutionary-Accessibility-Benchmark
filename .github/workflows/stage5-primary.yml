name: stage5-primary
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/stage5-trigger-*"
jobs:
  stage5:
    strategy:
      fail-fast: false
      matrix:
        baseline: [B1, B2, B3, B4]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: pytest -q
      - run: python scripts/run_stage5.py --baseline ${{ matrix.baseline }}
      - uses: actions/upload-artifact@v4
        with:
          name: stage5-primary-${{ matrix.baseline }}
          path: |
            results/stage5_primary_${{ matrix.baseline }}.csv
            results/stage5_outcomes/
