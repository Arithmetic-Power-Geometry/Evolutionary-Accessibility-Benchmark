name: timescale-diagnostic

on:
  push:
    paths:
      - ".github/workflows/timescale.yml"
      - "src/eab/exact.py"
      - "scripts/run_timescale_diagnostic.py"
      - "tests/test_exact.py"
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: pytest
      - run: python scripts/run_timescale_diagnostic.py
      - uses: actions/upload-artifact@v4
        with:
          name: timescale-diagnostic-results
          path: results/timescale_diagnostic.csv
          if-no-files-found: error
